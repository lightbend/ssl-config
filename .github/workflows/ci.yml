name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scala: [2.13.18, 2.12.21, 3.3.8]
        java: [temurin@11, temurin@8]
        exclude:
          - java: temurin@8
            os: macos-latest
          - java: temurin@8
            scala: 3.3.8
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        shell: bash
        run: git config --global core.autocrlf false

      - name: Configure pagefile for Windows
        if: contains(runner.os, 'windows')
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 2GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@11)
        if: matrix.java == 'temurin@11'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: sbt

      - name: Setup Java (temurin@8)
        if: matrix.java == 'temurin@8'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - if: github.repository == 'lightbend/ssl-config'
        shell: bash
        run: sbt '++ ${{ matrix.scala }}; validateCode; test; doc; mimaReportBinaryIssues'

      - if: matrix.java != 'temurin@8' && github.repository == 'lightbend/ssl-config'
        shell: bash
        run: ./scripts/validate-docs.sh

      - name: Compress target directories
        shell: bash
        run: tar cf targets.tar target ssl-config-core/target documentation/target project/target

      - name: Upload target directories
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ matrix.os }}-${{ matrix.scala }}-${{ matrix.java }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && (github.repository == 'lightbend/ssl-config')
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.12.21]
        java: [temurin@11]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Configure pagefile for Windows
        if: contains(runner.os, 'windows')
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 2GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@11)
        if: matrix.java == 'temurin@11'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: sbt

      - name: Setup Java (temurin@8)
        if: matrix.java == 'temurin@8'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download target directories (2.13.18)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-2.13.18-${{ matrix.java }}

      - name: Inflate target directories (2.13.18)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.12.21)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-2.12.21-${{ matrix.java }}

      - name: Inflate target directories (2.12.21)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3.3.8)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-3.3.8-${{ matrix.java }}

      - name: Inflate target directories (3.3.8)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Publish project
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release
